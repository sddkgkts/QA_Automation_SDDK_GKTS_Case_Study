# ============ BROWSER CONFIGURATION ============
browser.type=CHROME
browser.headless=false
browser.window.maximize=true
browser.implicit.wait=1
browser.explicit.wait=8
browser.poll.interval=250
browser.scroll.step.px=450
browser.scroll.pause.ms=150
browser.full.scroll.max.steps=25
browser.lever.link.wait=10
browser.page.load.timeout=25

# ============ HOMEPAGE MODULE CHECK ============
homepage.min.sections=5

# ============ UI TEST URLS ============
insider.home.page=https://insiderone.com/

# ============ API CONFIGURATION ============
api.petstore.url=https://petstore.swagger.io/v2

# ============ REPORTING ============
screenshot.on.failure=true
